sqlite:
  db:
    rss:
      - tableName: rss_result
        DDL: |
          CREATE TABLE rss_result (
            `id` integer PRIMARY KEY NOT NULL,
            `pid` integer NOT NULL,
            `title` varchar(500) NOT NULL,
            `torrent` varchar(100) NOT NULL,
            `pub_date` varchar(100) DEFAULT NULL,
            `hide` integer NOT NULL DEFAULT '0',
            `tracker` varchar(5000),
            `episode` varchar(10) DEFAULT NULL,
            `up_date` varchar(100) DEFAULT NULL,
            `sort` integer NOT NULL DEFAULT 0,
            CONSTRAINT `idx_pid_title` UNIQUE (`pid`, `title`)
          )
        sqlScript: "@/resource/script/rss_result.sql"
        forceImport: false
      - tableName: rss_subscribe
        DDL: |
          CREATE TABLE rss_subscribe (
            `id` integer PRIMARY KEY NOT NULL,
            `name` varchar(50) NOT NULL,
            `name_jp` varchar(50) DEFAULT NULL,
            `url` varchar(500) DEFAULT NULL,
            `regex` varchar(100) NOT NULL,
            `season` varchar(50) NOT NULL,
            `start_time` datetime DEFAULT NULL,
            `cover` varchar(500) DEFAULT NULL,
            `fin` varchar(1) DEFAULT 'N',
            `is_short` int NOT NULL DEFAULT '0',
            `anime_type` int NOT NULL DEFAULT '1',
            `goon` int NOT NULL DEFAULT '0',
            `staff` varchar(500) DEFAULT NULL,
            `cast` varchar(500) DEFAULT NULL,
            `origin_type` varchar(20) DEFAULT NULL,
            `type_tag` varchar(100) DEFAULT NULL,
            `broadcast` varchar(100) DEFAULT NULL,
            CONSTRAINT `idx_name` UNIQUE (`name`),
            CONSTRAINT `idx_season_cover` UNIQUE (`season`, `cover`)
          )
        sqlScript: "@/resource/script/rss_subscribe.sql"
        forceImport: false
      - tableName: rss_link
        DDL: |
          CREATE TABLE rss_link (
            `id` integer PRIMARY KEY NOT NULL,
            `pid` integer NOT NULL,
            `title` varchar(100) DEFAULT NULL,
            `href` varchar(500) DEFAULT NULL,
            CONSTRAINT `rss_link_unique` UNIQUE (`pid`, `title`, `href`)
          )
        sqlScript: "@/resource/script/rss_link.sql"
        forceImport: false
      - tableName: rss_copyright
        DDL: |
          CREATE TABLE rss_copyright (
            `id` integer PRIMARY KEY NOT NULL,
            `pid` integer NOT NULL,
            `area` varchar(20) DEFAULT NULL,
            `href` varchar(500) DEFAULT NULL,
            `image` varchar(200) DEFAULT NULL,
            CONSTRAINT `rss_copyright_unique` UNIQUE (
              `pid`,
              `area`,
              `href`,
              `image`
            )
          )
        sqlScript: "@/resource/script/rss_copyright.sql"
        forceImport: false
      - tableName: rss_tracker
        DDL: |
          CREATE TABLE rss_tracker (
            `id` integer PRIMARY KEY NOT NULL,
            `host` varchar(100) NOT NULL,
            CONSTRAINT `idx_host` UNIQUE (`host`)
          )
        sqlScript: "@/resource/script/rss_tracker.sql"
        forceImport: false
      - tableName: rss_regex_history
        DDL: |
          CREATE TABLE rss_regex_history (
            `id` integer PRIMARY KEY NOT NULL,
            `regex` varchar(256) NOT NULL,
            `score` bigint NOT NULL,
            CONSTRAINT `idx_regex` UNIQUE (`regex`)
          )
        sqlScript: "@/resource/script/rss_regex_history.sql"
        forceImport: false
      - tableName: rss_torrent_task
        DDL: |
          CREATE TABLE rss_torrent_task (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `rss_subs_id` integer NOT NULL,
            `rss_result_id` integer NOT NULL,
            `torrent_uuid` varchar(12) DEFAULT NULL,
            `torrent_hash` varchar(256) DEFAULT NULL,
            `status` varchar(1) NOT NULL,
            CONSTRAINT `idx_rss_result_id` UNIQUE (`rss_result_id`)
          );
          CREATE INDEX `idx_rss_tt_subs_id` ON rss_torrent_task(`rss_subs_id`);
      - tableName: rss_episode
        DDL: |
          CREATE TABLE rss_episode (
            `id` integer PRIMARY KEY NOT NULL,
            `rss_task_id` integer NOT NULL,
            `rss_subs_id` integer NOT NULL,
            `episode` varchar(10) NOT NULL,
            `minio_link` varchar(500) DEFAULT NULL,
            `status` varchar(1) NOT NULL,
            `object_size` text DEFAULT NULL,
            CONSTRAINT `idx_rss_id_episode` UNIQUE (`rss_subs_id`, `episode`)
          );
          CREATE INDEX `idx_rss_ep_task_id` ON rss_episode(`rss_task_id`);
          CREATE INDEX `idx_rss_ep_object_size` ON rss_episode(`object_size`);
      - tableName: rss_episode_failed
        DDL: |
          CREATE TABLE rss_episode_failed (
            `id` integer PRIMARY KEY NOT NULL,
            `rss_task_id` integer NOT NULL,
            `rss_subs_id` integer NOT NULL,
            `episode` varchar(10) DEFAULT NULL,
            `minio_link` varchar(500) DEFAULT NULL,
            `root_path` varchar(500) NOT NULL,
            `file_name` varchar(500) NOT NULL,
            `reason` varchar(1) NOT NULL,
            `create_time` datetime NOT NULL
          );
          CREATE INDEX `idx_rss_epf_subs_id` ON rss_episode_failed(`rss_subs_id`);
          CREATE INDEX `idx_rss_epf_task_id` ON rss_episode_failed(`rss_task_id`);
      - tableName: rss_episode_subtitle
        DDL: |
          CREATE TABLE rss_episode_subtitle (
            `id` integer PRIMARY KEY NOT NULL,
            `rss_task_id` integer NOT NULL,
            `rss_subs_id` integer NOT NULL,
            `title` text DEFAULT NULL,
            `episode` varchar(10) DEFAULT NULL,
            `minio_link` varchar(500) DEFAULT NULL,
            `root_path` varchar(500) NOT NULL,
            `file_name` varchar(500) NOT NULL,
            `fonts` text DEFAULT NULL,
            `status` integer NOT NULL,
            `file_status` integer NOT NULL,
            `object_size` text DEFAULT NULL
          );
          CREATE INDEX `idx_rss_ep_st_subs_id` ON rss_episode_subtitle(`rss_subs_id`);
          CREATE INDEX `idx_rss_ep_st_task_id` ON rss_episode_subtitle(`rss_task_id`);
          CREATE INDEX `idx_rss_ep_st_object_size` ON rss_episode_subtitle(`object_size`);
      - tableName: rss_fonts
        DDL: |
          CREATE TABLE rss_fonts (
            `id` integer PRIMARY KEY NOT NULL,
            `title` text NOT NULL,
            `minio_link` text DEFAULT NULL,
            `object_size` text DEFAULT NULL,
            CONSTRAINT `idx_rss_fonts_title` UNIQUE (`title`)
          );
          CREATE INDEX `idx_rss_fonts_object_size` ON rss_fonts(`object_size`);
    kuro:
      - tableName: kuro_community_account
        DDL: |
          CREATE TABLE kuro_community_account (
            `uid` integer PRIMARY KEY NOT NULL,
            `token` varchar(500) NOT NULL
          )
      - tableName: kuro_game_sign
        DDL: |
          CREATE TABLE kuro_game_sign (
            `uid` integer PRIMARY KEY NOT NULL,
            `game_ids` varchar(500) DEFAULT NULL
          )
    socket:
      - tableName: channel_notification
        DDL: |
          CREATE TABLE channel_notification (
            `id` integer PRIMARY KEY NOT NULL,
            `channel` varchar(50) NOT NULL,
            `message` varchar(5000),
            `extra` varchar(5000),
            `create_by` varchar(100) NOT NULL,
            `create_time` datetime NOT NULL
          )
    account:
      - tableName: auth_user
        DDL: |
          CREATE TABLE auth_user (
            `id` integer PRIMARY KEY NOT NULL,
            `uname` varchar(50) NOT NULL,
            `password` varchar(64) NOT NULL,
            `update_time` datetime,
            `create_time` datetime NOT NULL,
            CONSTRAINT `idx_uname` UNIQUE (`uname`)
          )
      - tableName: user_rss_favorites
        DDL: |
          CREATE TABLE user_rss_favorites (
            `id` integer PRIMARY KEY NOT NULL,
            `uid` integer NOT NULL,
            `rss_subs_id` integer NOT NULL,
            CONSTRAINT `idx_uid_rss_id` UNIQUE (`uid`, `rss_subs_id`)
          )
    media:
      - tableName: options
        DDL: |
          CREATE TABLE options (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `label` text NOT NULL,
            `description` text DEFAULT NULL,
            `value` text DEFAULT NULL,
            `update_time` datetime NOT NULL,
            CONSTRAINT `idx_media_opts_label` UNIQUE (`label`)
          );
      - tableName: favorites
        DDL: | 
          CREATE TABLE favorites (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `user_id` integer NOT NULL,
            `target_type` integer NOT NULL,
            `target_id` integer NOT NULL,
            `create_time` datetime NOT NULL,
            UNIQUE(`user_id`, `target_type`, `target_id`)
          );
          CREATE INDEX IF NOT EXISTS idx_favorites_user_id ON favorites(user_id);
          CREATE INDEX IF NOT EXISTS idx_favorites_target ON favorites(target_type, target_id);
      - tableName: videos
        DDL: |
          CREATE TABLE videos (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `unique_id` varchar(100) NOT NULL,
            `title` varchar(500) NOT NULL,
            `category_id` integer NOT NULL,
            `author_id` integer NOT NULL,
            `cover_id` integer DEFAULT NULL,
            `upload_time` datetime NOT NULL,
            `status` integer NOT NULL,
            `create_time` datetime NOT NULL,
            `total_size` text DEFAULT NULL
          );
          CREATE INDEX `idx_video_unique` ON videos(`unique_id`);
          CREATE INDEX `idx_video_category` ON videos(`category_id`);
          CREATE INDEX `idx_video_author` ON videos(`author_id`);
          CREATE INDEX `idx_video_upload_time` ON videos(`upload_time`);
          CREATE INDEX `idx_video_total_size` ON videos(`total_size`);
      - tableName: categories
        DDL: |
          CREATE TABLE categories (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `name` varchar(100) NOT NULL,
            `type` integer NOT NULL DEFAULT 0,
            CONSTRAINT `idx_category_name` UNIQUE (`name`)
          )
      - tableName: authors
        DDL: |
          CREATE TABLE authors (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `category_id` integer NOT NULL,
            `name` varchar(100) NOT NULL,
            CONSTRAINT `idx_author_name` UNIQUE (`category_id`, `name`)
          );
          CREATE INDEX `idx_authors_category` ON authors(`category_id`);
      - tableName: tags
        DDL: |
          CREATE TABLE tags (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `name` varchar(100) NOT NULL,
            CONSTRAINT `idx_tag_name` UNIQUE (`name`)   
          )
      - tableName: video_tag_map
        DDL: |
          CREATE TABLE video_tag_map (
            `video_id` integer NOT NULL,
            `tag_id` integer NOT NULL,
            PRIMARY KEY (`video_id`, `tag_id`)
          );
          CREATE INDEX `idx_tag_video` ON video_tag_map(`tag_id`);
      - tableName: blacklist
        DDL: |
          CREATE TABLE blacklist (
            `category_id` integer NOT NULL,
            `type` integer NOT NULL,
            `value` text NOT NULL,
            CONSTRAINT `idx_blacklist_unique` UNIQUE (`category_id`, `type`, `value`)
          )
      - tableName: whitelist
        DDL: |
          CREATE TABLE whitelist (
            `category_id` integer NOT NULL,
            `type` integer NOT NULL,
            `value` text NOT NULL,
            CONSTRAINT `idx_blacklist_unique` UNIQUE (`category_id`, `type`, `value`)
          )
      - tableName: video_minio
        DDL: |
          CREATE TABLE video_minio (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `video_id` integer NOT NULL,
            `type` integer NOT NULL,
            `origin_uri` text NOT NULL,
            `link` text NOT NULL,
            `title` text DEFAULT NULL,
            `status` integer NOT NULL,
            `sort` integer NOT NULL DEFAULT 0,
            `object_size` text DEFAULT NULL
          );
          CREATE UNIQUE INDEX idx_video_type1_unique ON video_minio(`video_id`) WHERE type = 1;
          CREATE INDEX idx_minio_vid_size ON video_minio (video_id, object_size);
      - tableName: aria2_task
        DDL: |
          CREATE TABLE aria2_task (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `minio_id` integer NOT NULL,
            `gid` varchar(100) NOT NULL,
            `file_path` varchar(500) DEFAULT NULL,
            `file_num` integer DEFAULT NULL,
            `status` integer NOT NULL,
            CONSTRAINT `idx_unique_gid` UNIQUE (`gid`)
          );
      - tableName: playlists
        DDL: |
          CREATE TABLE playlists (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `category_id` integer NOT NULL,
            `title` varchar(500) NOT NULL,
            `create_time` datetime NOT NULL
          );
          CREATE INDEX `idx_playlist_category` ON playlists(`category_id`);
          CREATE INDEX `idx_playlist_title` ON playlists(`title`);
      - tableName: playlist_videos
        DDL: |
          CREATE TABLE playlist_videos (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `playlist_id` integer NOT NULL,
            `video_id` integer NOT NULL,
            `sort` integer NOT NULL DEFAULT 0,
            UNIQUE(`playlist_id`, `video_id`)
          );
          CREATE INDEX `idx_pv_playlist_sort` ON playlist_videos(`playlist_id`, `sort`);
          CREATE INDEX `idx_pv_video` ON playlist_videos(`video_id`);
      - tableName: bilive_record
        DDL: |
          CREATE TABLE bilive_record (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `event` integer NOT NULL,
            `session_id` text DEFAULT NULL,
            `room_id` integer NOT NULL,
            `event_timestamp` datetime NOT NULL,
            `event_id` text NOT NULL,
            `event_data` text NOT NULL,
            `create_time` datetime DEFAULT CURRENT_TIMESTAMP
          );
          CREATE INDEX `idx_br_session_id` ON bilive_record(`session_id`);
      - tableName: bilive_record_stream
        DDL: |
          CREATE TABLE bilive_record_stream (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `room_id` integer NOT NULL,
            `host_name` text DEFAULT NULL,
            `title` text DEFAULT NULL,
            `area_name_parent` text DEFAULT NULL,
            `area_name_child` text DEFAULT NULL,
            `start_time` datetime DEFAULT NULL,
            `end_time` datetime DEFAULT NULL,
            `streaming` integer DEFAULT 1,
            `end_reason` text DEFAULT NULL,
            `end_by_record_id` integer DEFAULT NULL,
            `video_id` integer DEFAULT NULL
          );
          CREATE INDEX `idx_br_stream_room_id` ON bilive_record_stream(`room_id`);
          CREATE INDEX `idx_br_stream_host_name` ON bilive_record_stream(`host_name`);
          CREATE INDEX `idx_br_stream_title` ON bilive_record_stream(`title`);
      - tableName: bilive_record_session
        DDL: |
          CREATE TABLE bilive_record_session (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `session_id` text NOT NULL,
            `stream_id` integer NOT NULL,
            `room_id` integer NOT NULL,
            `start_time` datetime DEFAULT NULL,
            `end_time` datetime DEFAULT NULL,
            `status` integer DEFAULT 0,
            CONSTRAINT `idx_unique_session_id` UNIQUE (`session_id`)
          );
          CREATE INDEX `idx_br_session_stream_id` ON bilive_record_session(`stream_id`);
          CREATE INDEX `idx_br_session_room_id` ON bilive_record_session(`room_id`);
      - tableName: bilive_record_files
        DDL: |
          CREATE TABLE bilive_record_files (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `session_id` text NOT NULL,
            `stream_id` integer NOT NULL,
            `title` text NOT NULL,
            `file_path` text NOT NULL,
            `file_size` integer DEFAULT NULL,
            `start_time` datetime DEFAULT NULL,
            `end_time` datetime DEFAULT NULL,
            `file_status` integer NOT NULL DEFAULT 0,
            `sync_status` integer NOT NULL DEFAULT 0
          );
          CREATE INDEX `idx_br_files_session_id` ON bilive_record_files(`session_id`);
          CREATE INDEX `idx_br_files_record_stream_id` ON bilive_record_files(`stream_id`);
          CREATE INDEX `idx_br_files_record_file_path` ON bilive_record_files(`file_path`);
    execution:
      - tableName: migrations
        DDL: |
          CREATE TABLE migrations (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `file_name` text NOT NULL,
            `file_content` text,
            `execute_at` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `successful` integer NOT NULL,
            `failed_reason` text,
            `backup_file` text
          );
    statistics:
      - tableName: storage_summary
        DDL: |
          CREATE TABLE storage_summary (
            `id` integer PRIMARY KEY AUTOINCREMENT NOT NULL,
            `summary_at` datetime NOT NULL DEFAULT CURRENT_TIMESTAMP,
            `total_count` integer NOT NULL DEFAULT 0,
            `total_size` text DEFAULT NULL,
            `dimensions` json DEFAULT NULL
          );
          CREATE INDEX `idx_ss_summary_at` ON storage_summary(`summary_at`);
