kind: pipeline
type: kubernetes
name: build-base-image
trigger:
  branch:
    - base
  event:
    - push
steps:
  - name: build-and-push-base
    image: plugins/docker
    settings:
      registry: gitea.vinoxm.top
      repo: gitea.vinoxm.top/vinoxm/node-server-base
      insecure: true
      dockerfile: Dockerfile.base
      username:
        from_secret: GITEA_USERNAME
      password:
        from_secret: GITEA_PASSWORD
      tags:
        - latest